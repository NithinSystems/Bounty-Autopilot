name: Verify bounty patch

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Public HTTPS Git repository URL
        required: true
        type: string
      baseline_ref:
        description: Full baseline commit SHA
        required: true
        type: string
      patched_ref:
        description: Full patched commit SHA
        required: true
        type: string
      bounty_id:
        description: Internal bounty identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPOSITORY_URL: ${{ inputs.repository_url }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
      PATCHED_REF: ${{ inputs.patched_ref }}
      BOUNTY_ID: ${{ inputs.bounty_id }}
    steps:
      - name: Check out trusted collector
        uses: actions/checkout@v4

      - name: Validate and collect evidence
        run: bash scripts/collect-evidence.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.bounty_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
